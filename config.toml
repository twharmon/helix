theme = "catppuccin_macchiato"

[editor]
line-number = "relative"
gutters = ["spacer", "diagnostics", "spacer", "diff", "line-numbers", "spacer"]
color-modes = true
cursorline = true
idle-timeout = 50
true-color=true
completion-trigger-len = 1
# end-of-line-diagnostics = "hint" 

[editor.inline-diagnostics]
cursor-line = "error" 
other-lines = "disable"

[editor.cursor-shape]
insert = "bar"
normal = "block"

[editor.search]
smart-case = false

[editor.statusline]
left = ["mode", "spacer", "version-control", "workspace-diagnostics"]
center = ["file-name", "file-modification-indicator", "file-type"]
right = ["diagnostics", "selections", "primary-selection-length", "position"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.file-picker]
git-ignore = false
ignore = false

[keys.normal]
"space" = { q = ":q", w = ":w", c = ":buffer-close", o = ":buffer-close-others", f = "file_picker_in_current_directory"}
"'" = "repeat_last_motion"
L = "extend_to_line_end"
H = "extend_to_line_start"
"A-j" = ["extend_to_line_bounds", "delete_selection", "paste_after"]
"A-k" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

[keys.select]
"space" = { q = ":q", w = ":w", c = ":buffer-close", o = ":buffer-close-others", f = "file_picker_in_current_directory"}
"'" = "repeat_last_motion"
L = "extend_to_line_end"
H = "extend_to_line_start"
"A-j" = ["extend_to_line_bounds", "delete_selection", "paste_after"]
"A-k" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
